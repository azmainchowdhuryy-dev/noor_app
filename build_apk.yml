name: Build APK

# GitHub-এর সার্ভারে অ্যাপ বানায় - আপনার PC-তে কিছু ইনস্টল করতে হবে না।
# Actions ট্যাব -> Build APK -> Run workflow চাপলেই চলবে।
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android প্রজেক্ট ফাইল তৈরি (প্রথমবার)
        run: |
          if [ ! -d android ]; then
            cp -r lib /tmp/lib_bak
            cp pubspec.yaml /tmp/pubspec_bak
            flutter create --platforms=android --project-name noor_app --org com.azmain.noor .
            rm -rf lib test
            cp -r /tmp/lib_bak lib
            cp /tmp/pubspec_bak pubspec.yaml
          fi

      - name: লোকেশন পারমিশন যোগ
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q ACCESS_COARSE_LOCATION "$M"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <application#' "$M"
          fi

      - run: flutter pub get

      - name: কোড যাচাই (এরর থাকলে এখানে লাল হবে)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: noor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
